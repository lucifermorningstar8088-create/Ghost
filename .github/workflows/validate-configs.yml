name: Validate Ghost configuration

on:
  pull_request:
  push:
    branches:
      - main
      - feat/ghost-tool-coverage-registry
      - feat/ghost-channel-customization-studio
      - feat/ghost-complete-workflow-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-configs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config-validation:
    name: JSON Schema and YAML contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned validation dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Validate schemas, fixtures, and tool inventory
        run: python scripts/validate_configs.py
